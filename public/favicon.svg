<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background -->
  <rect width="64" height="64" rx="0" fill="#ffffff"/>

  <!-- G letter (left, slightly overlapping O) -->
  <!-- G arc: open circle on the right side -->
  <g fill="none" stroke="#0d0d0d" stroke-width="4" stroke-linecap="round">
    <!-- G arc: most of a circle, open on right, centered at (22,32) r=14 -->
    <path d="M 36 22 A 14 14 0 1 0 36 42" />
    <!-- G crossbar -->
    <line x1="28" y1="32" x2="36" y2="32"/>
  </g>

  <!-- O letter (right, overlapping G) centered at (40,32) r=13 -->
  <circle cx="40" cy="32" r="13" fill="#ffffff" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Golf flag inside O -->
  <!-- Flagpole -->
  <line x1="40" y1="24" x2="40" y2="39" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flag (triangle pointing right) -->
  <polygon points="40,24 47,27.5 40,31" fill="#0d0d0d"/>
  <!-- Putting green hill -->
  <ellipse cx="40" cy="39" rx="6" ry="2.5" fill="none" stroke="#0d0d0d" stroke-width="1.2"/>
  <!-- Fairway path (small curved line) -->
  <path d="M 35 40 Q 38 37 40 39" fill="none" stroke="#0d0d0d" stroke-width="1" stroke-linecap="round"/>
</svg>
