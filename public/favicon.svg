<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background, square -->
  <rect width="64" height="64" fill="#ffffff"/>

  <!-- G centered at (20,32) r=13 -->
  <!-- Arc starts upper-right (~45deg above horizontal), sweeps clockwise all the way to right-middle -->
  <path d="M 29 23 A 13 13 0 1 1 33 32" fill="none" stroke="#0d0d0d" stroke-width="4" stroke-linecap="round"/>
  <!-- G crossbar: from right-middle inward, extends just past the O's left edge so it stays visible -->
  <line x1="23" y1="32" x2="33" y2="32" stroke="#0d0d0d" stroke-width="4" stroke-linecap="round"/>

  <!-- O centered at (43,32) r=12, white fill covers G internals for layered look -->
  <circle cx="43" cy="32" r="12" fill="#ffffff" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Golf flag inside O -->
  <line x1="43" y1="24" x2="43" y2="38" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="43,24 49,27 43,30" fill="#0d0d0d"/>
  <ellipse cx="43" cy="38" rx="5.5" ry="2" fill="none" stroke="#0d0d0d" stroke-width="1.2"/>
</svg>
